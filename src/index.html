<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <title>Omnichannel CRM</title>
  <meta id="appName" name="application-name" content="Omnichannel CRM">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.png">
  <base href="/">
  <script>
    // Applies the saved theme before the first paint, so dark mode never flashes white.
    // Mirrors src/app/theme/themeStore.ts (keys, values, defaults, classes); React keeps it in step after load.
    (function () {
      try {
        var root = document.documentElement.classList;
        var mq = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
        var scheme = localStorage.getItem('omnichannel.theme');
        var contrast = localStorage.getItem('omnichannel.theme.contrast') || 'glass';
        if (scheme === 'dark' || (scheme !== 'light' && mq('(prefers-color-scheme: dark)'))) root.add('pf-v6-theme-dark');
        if (localStorage.getItem('omnichannel.theme.brand') === 'felt') root.add('pf-v6-theme-felt');
        if (contrast === 'glass') root.add('pf-v6-theme-glass');
        if (contrast === 'high-contrast' || (contrast === 'system' && mq('(prefers-contrast: more)'))) root.add('pf-v6-theme-high-contrast');
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <noscript>Enabling JavaScript is required to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
